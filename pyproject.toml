[project]
name = "extraction-evals"
version = "0.1.0"
description = "Per-field evals for document extraction: intervals, confidence signals and regression tests"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "google-genai>=2.34",
  "openai>=3.40",
  "numpy>=2.0",
  "scipy>=1.13",
  "pillow>=11",
  "matplotlib>=3.9",
  "pyarrow>=17",
  "pytesseract>=0.3.13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["xeval", "xeval.data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
